spring:
  application:
    name: url-shortener-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DATABASE_USERNAME:shortener}
    password: ${DATABASE_PASSWORD:shortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:}

url-shortener:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  code-length: ${SHORT_CODE_LENGTH:6}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
